[package]
name = "emacs-nucleo"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
emacs = { version = "0.23.0", features = ["emacs-28"] }
mimalloc = { version = "0.1.52" }
nucleo = "0.5.0"

[profile.release]
codegen-units = 1
strip = true
incremental = false
lto = 'fat'
opt-level = 3           # <-
# panic = "abort"
